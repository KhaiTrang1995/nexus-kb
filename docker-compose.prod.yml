services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_kb}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-internal

  qdrant:
    image: qdrant/qdrant:v1.13.3
    container_name: nexus-kb-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The official qdrant/qdrant image has no wget/curl/nc -- only bash,
      # which can do a raw TCP connect check via /dev/tcp. Verified against
      # v1.13.3: `wget`-based healthchecks always fail with "not found"
      # (exit 127) and mark the container permanently unhealthy even though
      # Qdrant itself is up, which then blocks every dependent service.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexus-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexus-kb-api
    restart: unless-stopped
    environment:
      POSTGRES_DSN: "postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus_kb}"
      QDRANT_HOST: "qdrant"
      QDRANT_HTTP_PORT: "6333"
      NEXUS_EMBEDDING_MODEL: ${NEXUS_EMBEDDING_MODEL:-BAAI/bge-m3}
      NEXUS_EMBEDDING_DIMENSION: ${NEXUS_EMBEDDING_DIMENSION:-1024}
      AUTH_MODE: ${AUTH_MODE:-jwt}
      JWT_SECRET: ${JWT_SECRET}
      AUDIT_LOG_DIR: /app/data
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:11434}
      GRAPH_DOMAIN: ${GRAPH_DOMAIN:-general}
      UPLOAD_STAGING_DIR: /app/data/uploads
      UPLOAD_MAX_FILES_PER_BATCH: ${UPLOAD_MAX_FILES_PER_BATCH:-5}
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-50}
      INGESTION_JOB_MAX_ATTEMPTS: ${INGESTION_JOB_MAX_ATTEMPTS:-3}
      CONFLUENCE_BASE_URL: ${CONFLUENCE_BASE_URL:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      CONFLUENCE_SYNC_PAGE_LIMIT: ${CONFLUENCE_SYNC_PAGE_LIMIT:-100}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-internal
    volumes:
      - app_data:/app/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexus-kb-worker
    restart: unless-stopped
    # Same image as `api` (same PYTHONPATH, same dependencies) -- only the
    # entrypoint differs. Processes the ingestion_jobs FIFO queue (uploads
    # from the web console and pages fetched by a Confluence sync run), so it
    # needs the same Postgres/Qdrant/embedding config as `api`, plus the same
    # /app/data volume (UPLOAD_STAGING_DIR must resolve to the same path in
    # both containers, since the API stages files there and the worker reads
    # them back).
    entrypoint: ["sh", "-c", "alembic -c infrastructure/alembic.ini upgrade head && python -m nexus_document_parser.worker"]
    environment:
      POSTGRES_DSN: "postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus_kb}"
      QDRANT_HOST: "qdrant"
      QDRANT_HTTP_PORT: "6333"
      NEXUS_EMBEDDING_MODEL: ${NEXUS_EMBEDDING_MODEL:-BAAI/bge-m3}
      NEXUS_EMBEDDING_DIMENSION: ${NEXUS_EMBEDDING_DIMENSION:-1024}
      INGESTION_WORKER_POLL_SECONDS: ${INGESTION_WORKER_POLL_SECONDS:-2.0}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - nexus-internal
    volumes:
      - app_data:/app/data

  web:
    build:
      context: ./apps/web-console
      dockerfile: Dockerfile
    container_name: nexus-kb-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nexus-internal

volumes:
  postgres_data:
  qdrant_data:
  app_data:

networks:
  nexus-internal:
    driver: bridge
