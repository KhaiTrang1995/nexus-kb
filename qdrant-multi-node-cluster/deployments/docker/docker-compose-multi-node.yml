version: '3.9'

services:
    qdrant_node1:
        image: qdrant/qdrant:latest
        container_name: qdrant_node1
        restart: always
        ports:
            - '6333:6333'
            - '6335:6335'
        environment:
            QDRANT__CLUSTER__ENABLED: 'true'
            QDRANT__CLUSTER__P2P__PORT: '6335'
            QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY}
        volumes:
            - ./data/node1:/qdrant/storage
        command: ['./qdrant', '--uri', 'http://qdrant_node1:6335']

    qdrant_node2:
        image: qdrant/qdrant:latest
        container_name: qdrant_node2
        restart: always
        ports:
            - '6343:6333'
        volumes:
            - ./data/node2:/qdrant/storage
        environment:
            QDRANT__CLUSTER__ENABLED: 'true'
            QDRANT__CLUSTER__P2P__PORT: '6335'
            QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY}
        command:
            [
                './qdrant',
                '--bootstrap',
                'http://qdrant_node1:6335',
                '--uri',
                'http://qdrant_node2:6335',
            ]

    qdrant_node3:
        image: qdrant/qdrant:latest
        container_name: qdrant_node3
        restart: always
        ports:
            - '6353:6333'
        volumes:
            - ./data/node3:/qdrant/storage
        environment:
            QDRANT__CLUSTER__ENABLED: 'true'
            QDRANT__CLUSTER__P2P__PORT: '6335'
            QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY}
        command:
            [
                './qdrant',
                '--bootstrap',
                'http://qdrant_node1:6335',
                '--uri',
                'http://qdrant_node3:6335',
            ]

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        user: root
        depends_on:
            - qdrant_node1
            - qdrant_node2
            - qdrant_node3
        environment:
            # Truyền API key vào container
            QDRANT_API_KEY: ${QDRANT__SERVICE__API_KEY}
        volumes:
            - ../../config/prometheus.yml:/etc/prometheus/prometheus.yml
            - ./prometheus-entrypoint.sh:/prometheus-entrypoint.sh
        ports:
            - '9090:9090'
        entrypoint: ['/bin/sh', '/prometheus-entrypoint.sh']
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.enable-lifecycle'

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - '3000:3000'
        environment:
            GF_SECURITY_ADMIN_USER: 'admin'
            GF_SECURITY_ADMIN_PASSWORD: 'admin'
            GF_USERS_ALLOW_SIGN_UP: 'true'
            GF_AUTH_ANONYMOUS_ENABLED: 'false'
        volumes:
            - grafana-data:/var/lib/grafana
            - ../../config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
            - ../../config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
            - ../../config/qdrant-selfhosted-dashboard.json:/etc/grafana/provisioning/dashboards/json/qdrant-selfhosted-dashboard.json
            - ../../config/grafana.json:/etc/grafana/provisioning/dashboards/json/qdrant-basic-dashboard.json
        depends_on:
            - prometheus

volumes:
    grafana-data: {}
