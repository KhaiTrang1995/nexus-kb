apiVersion: 1

providers:
    - name: 'Qdrant Dashboards'
      orgId: 1
      folder: 'Qdrant'
      folderUid: 'qdrant-folder'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 30
      allowUiUpdates: true
      options:
          path: /etc/grafana/provisioning/dashboards/json
